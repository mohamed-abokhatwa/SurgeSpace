# Builds the desktop apps on GitHub's machines:
#   • Windows → SurgeSpace_<version>.msix for the Microsoft Store (free listing; licences by email)
#   • macOS   → universal SurgeSpace.dmg, signed and notarized when the Apple secrets are set
# Run it from the Actions tab ("Run workflow") or by pushing a tag such as v1.0.0.
name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b
      - run: npx tsx tests/engine.test.ts
      - run: npx tsx tests/license.test.ts

  windows-store:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tauri build --no-bundle
      - name: Package MSIX
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          if ($v -eq '0.0.0') { $v = '1.0.0' }
          # Until the Partner Center values are set as repository variables, build a test package with placeholders.
          $id = if ("${{ vars.MSIX_IDENTITY_NAME }}") { "${{ vars.MSIX_IDENTITY_NAME }}" } else { "EngineeringWorkspace.SurgeSpace.Test" }
          $pub = if ("${{ vars.MSIX_PUBLISHER }}") { "${{ vars.MSIX_PUBLISHER }}" } else { "CN=SurgeSpaceTest" }
          $disp = if ("${{ vars.MSIX_PUBLISHER_DISPLAY }}") { "${{ vars.MSIX_PUBLISHER_DISPLAY }}" } else { "Engineering Workspace" }
          ./msix/pack.ps1 -IdentityName $id -Publisher $pub -PublisherDisplay $disp -Version "$v.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with: { name: SurgeSpace-MicrosoftStore, path: msix/*.msix }

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Build, sign and notarize
        run: |
          # Without the Apple secrets, build an unsigned test DMG (empty values would make signing fail).
          if [ -z "$APPLE_CERTIFICATE" ]; then unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; fi
          npx tauri build --target universal-apple-darwin
        env:
          # Leave these secrets unset for an unsigned test build.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with: { name: SurgeSpace-macOS, path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg }
