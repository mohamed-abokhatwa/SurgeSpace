# Builds the desktop apps on GitHub's machines:
#   • Windows → SurgeSpace_<version>.msix for the Microsoft Store (free listing; licences by email)
#   • macOS   → universal SurgeSpace.dmg, signed and notarized when the Apple secrets are set
# Run it from the Actions tab ("Run workflow") or by pushing a tag such as v1.0.0.
name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b
      - run: npx tsx tests/engine.test.ts
      - run: npx tsx tests/license.test.ts
      - run: npx tsx tests/devices.test.ts
      - run: npx tsx tests/valves.test.ts
      - run: npx tsx tests/report.test.ts
      - run: npx tsx tests/workspace.test.ts
      - run: npx tsx tests/ai.test.ts
      - run: npx tsx tests/eps.test.ts
      - run: npx tsx tests/fourq.test.ts
      - run: npx tsx tests/rigid.test.ts
      - run: npx tsx tests/phase5.test.ts
      - run: npx tsx tests/forces.test.ts
      - run: npx tsx tests/vsd.test.ts
      - run: npx tsx validation/control-valves-vs-epanet.ts

  windows-store:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tauri build --no-bundle
      - name: Package MSIX
        shell: pwsh
        run: |
          # Store rule: the last of the four numbers must be 0, so the build number goes third (1.0.<run>.0)
          $parts = (Get-Content package.json | ConvertFrom-Json).version.Split('.')
          $v = "$($parts[0]).$($parts[1]).${{ github.run_number }}"
          # Partner Center → Product identity (repository variables override these).
          $id = if ("${{ vars.MSIX_IDENTITY_NAME }}") { "${{ vars.MSIX_IDENTITY_NAME }}" } else { "EngineeringWorkspace.SurgeSpace" }
          $pub = if ("${{ vars.MSIX_PUBLISHER }}") { "${{ vars.MSIX_PUBLISHER }}" } else { "CN=7383AB48-1669-4729-94F1-696779C5DEAF" }
          $disp = if ("${{ vars.MSIX_PUBLISHER_DISPLAY }}") { "${{ vars.MSIX_PUBLISHER_DISPLAY }}" } else { "Engineering Workspace" }
          ./msix/pack.ps1 -IdentityName $id -Publisher $pub -PublisherDisplay $disp -Version "$v.0"
      - uses: actions/upload-artifact@v4
        with: { name: SurgeSpace-MicrosoftStore, path: msix/*.msix }
      - name: Copy the package to the store-builds branch (download with git, no API needed)
        shell: pwsh
        run: |
          $f = Get-ChildItem msix/*.msix | Select-Object -First 1
          $tmp = Join-Path $env:RUNNER_TEMP "store-builds"
          New-Item -ItemType Directory $tmp | Out-Null
          Copy-Item $f.FullName $tmp
          Set-Location $tmp
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b store-builds
          git add .
          git commit -q -m "MSIX $($f.Name) (run ${{ github.run_number }}, ${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" store-builds

  macos:
    needs: test
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Build, sign and notarize
        run: |
          # Without the Apple secrets, build an unsigned test DMG (empty values would make signing fail).
          if [ -z "$APPLE_CERTIFICATE" ]; then unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY; fi
          # Notarization with an App Store Connect API key (preferred) or with an Apple ID.
          if [ -n "$APPLE_API_KEY_P8" ]; then
            mkdir -p ~/private_keys && printf '%s' "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_$APPLE_API_KEY.p8
            export APPLE_API_KEY_PATH=~/private_keys/AuthKey_$APPLE_API_KEY.p8
          else
            unset APPLE_API_ISSUER APPLE_API_KEY
          fi
          [ -z "$APPLE_ID" ] && unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          npx tauri build --target universal-apple-darwin
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Check signature and notarization
        if: env.HAS_CERT == 'true'
        run: |
          APP=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose "$APP"
          xcrun stapler validate "$APP"
      - uses: actions/upload-artifact@v4
        with: { name: SurgeSpace-macOS, path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg }
