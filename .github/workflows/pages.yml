# Publishes the website (surgespace.engspace.app) with GitHub Pages whenever the site, the manuals or the
# screenshots change on main. Cloudflare DNS points surgespace.engspace.app at this Pages site.
name: Website
on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: website
      - run: node build.mjs
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
