# Tests on every push and pull request (and called by the desktop build before packaging).
name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npx tsx validation/control-valves-vs-epanet.ts
      - run: npx tsx validation/examples-baseline.ts
      - run: npx tsx validation/pda-vs-epanet.ts
      - run: pip install scipy && npx tsx validation/ode-check.ts --assert
      - run: pip install ezdxf && npx tsx validation/dxf-check.ts /tmp/s.dxf && python3 validation/dxf-audit.py /tmp/s.dxf

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build && node tests/ui-smoke.mjs
      - run: npm run build:demo && node tests/ui-large.mjs && node tests/ui-intake.mjs && node tests/ui-plan.mjs

  qgis-plugin:
    # the QGIS plug-in, run inside a real (headless) QGIS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-qgis qgis-providers
      - run: QT_QPA_PLATFORM=offscreen /usr/bin/python3 plugins/qgis/tests/test_plugin.py

  desktop-linux:
    # the real desktop app (Linux build of the same Tauri app) driven through WebDriver: engine worker under the
    # app's security policy, native licence commands, and the copilot over the native HTTP client with streaming.
    # Runs for pull requests, release builds and on request (it takes several minutes).
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev pkg-config webkit2gtk-driver xvfb
      - run: cargo install tauri-driver --locked
      - run: npm ci
      - run: npx tauri build --no-bundle
      - run: xvfb-run -a node tests/desktop-e2e.mjs
