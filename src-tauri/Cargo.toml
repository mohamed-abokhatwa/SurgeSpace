[package]
name = "surgespace"
version = "2.0.0"
description = "SurgeSpace: network surge analysis"
authors = ["Engineering Workspace (engspace.app)"]
edition = "2021"

[lib]
name = "surgespace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
machine-uid = "0.5"
sha2 = "0.10"
gethostname = "0.5"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
