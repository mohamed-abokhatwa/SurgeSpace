# SurgeSpace licence server. Its own Worker, D1 database and hostname, so it can never affect
# Engineering Workspace (Worker "engspace-licences" on lic.engspace.app).
name = "surgespace-licence"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "surgespace-licences.engspace.app", custom_domain = true }]

[vars]
BASE = ""

[[d1_databases]]
binding = "DB"
database_name = "surgespace-licences"
database_id = "5139398f-6eda-47d0-ab25-4dcd5a0bccc2"
migrations_dir = "migrations"
